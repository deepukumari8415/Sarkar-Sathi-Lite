<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarkar Sathi AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🇮🇳 Sarkar Sathi AI</h1>
    <p>Your Offline Government Assistant</p>

    <div id="chatBox" class="chat-box">
        <div class="bot">
            👋 Hello! I am Sarkar Sathi.<br><br>
            Ask me about:
            <br>• Aadhaar
            <br>• PAN Card
            <br>• PM Kisan
            <br>• Scholarship
            <br>• Passport
            <br>• Government Jobs
        </div>
    </div>

    <div class="inputArea">
        <input
            type="text"
            id="userInput"
            placeholder="Type your question here..."
        >

        <button id="sendBtn">
            Ask
        </button>
    </div>

</div>

<script src="knowledge.js"></script>
<script src="script.js"></script>

</body>
</html>
