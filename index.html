<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarkar Sathi AI (Offline)</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🇮🇳 Sarkar Sathi AI</h1>
    <p>Your Offline Smart Bharat Assistant</p>

    <div id="chatBox">

        <div class="bot">
            👋 Namaste! Main Sarkar Sathi hoon.

            <br><br>

            Aap mujhse pooch sakte hain:

            <ul>
                <li>Aadhaar</li>
                <li>PAN Card</li>
                <li>PM Kisan</li>
                <li>Ayushman Bharat</li>
                <li>Scholarship</li>
                <li>Passport</li>
                <li>Driving Licence</li>
                <li>Government Jobs</li>
                <li>Emergency Numbers</li>
            </ul>

        </div>

    </div>

    <div class="inputArea">

        <input
        type="text"
        id="userInput"
        placeholder="Type your question...">

        <button id="sendBtn">
            Ask
        </button>

    </div>

</div>

<script src="knowledge.js"></script>
<script src="script.js"></script>

</body>
</html>
